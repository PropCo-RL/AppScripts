name: Daily Backup Apps Scripts

on:
  schedule:
    - cron: '0 2 * * *' # Täglich um 02:00 Uhr UTC
  workflow_dispatch: # Manueller Start per Button

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Google APIs installieren
        run: npm install googleapis

      - name: Skripte via Service Account synchronisieren
        env:
          GAPPSCRIPT_SA_CREDENTIALS: ${{ secrets.GAPPSCRIPT_SA_CREDENTIALS }}
        run: node scripts/sync-all.js

      - name: Änderungen in GitHub committen & pushen
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automatisches Backup aller Apps Scripts [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
