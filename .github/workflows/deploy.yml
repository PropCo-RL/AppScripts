name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GAppScript_SA_CREDENTIALS }}
          token_format: 'access_token'
          access_token_scopes: |-
            https://www.googleapis.com/auth/script.projects
            https://www.googleapis.com/auth/drive.file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Configure Clasp Credentials
        run: |
          cat << 'EOF' > ~/.clasprc.json
          {
            "token": {
              "access_token": "${{ steps.auth.outputs.access_token }}",
              "scope": "https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/drive.file",
              "token_type": "Bearer",
              "expiry_date": 253402300799000
            },
            "oauth2ClientSettings": {
              "clientId": "dummy.apps.googleusercontent.com",
              "clientSecret": "dummy_secret",
              "redirectUri": "http://localhost"
            },
            "isLocalCreds": false
          }
          EOF

      - name: Push Code
        run: clasp push --force
