name: Deploy ONLY GitHub_1 to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      # WICHTIG: Reagiert NUR, wenn Dateien im Ordner projects/GitHub_1 verändert werden!
      - 'projects/GitHub_1/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clasp installieren
        run: npm install -g @google/clasp

      - name: Clasp Anmeldedatei konfigurieren
        env:
          GAPPSCRIPT_SA_CREDENTIALS: ${{ secrets.GAPPSCRIPT_SA_CREDENTIALS }}
        run: |
          echo "$GAPPSCRIPT_SA_CREDENTIALS" > ~/.clasprc.json

      - name: Nur GitHub_1 zu Google Apps Script pushen
        run: |
          if [ -d "projects/GitHub_1" ]; then
            echo "Pushe Änderungen für projects/GitHub_1..."
            cd projects/GitHub_1
            clasp push --force
          fi
